[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arbo-ocr-python"
version = "0.3.0"
description = "Python wrapper for arboOCR — runs the prebuilt arboocr_demo binary via subprocess, no C++ build required."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "wafik", email = "ulinkemana@gmail.com" },
]
keywords = ["ocr", "arboocr", "paddleocr"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/wafik/ArboOCR"
Repository = "https://github.com/wafik/ArboOCR"

[project.scripts]
arbo-ocr-install = "arbo_ocr.installer:main"

[tool.setuptools.packages.find]
include = ["arbo_ocr*"]
